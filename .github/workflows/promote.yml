name: Promote
# ================
# OPTIONAL MANUAL PROMOTION
# Promotes the version-tagged multi-arch Docker manifests pushed by
# ci.yml to latest / X / X.Y on the fork's GHCR repository.
# Pure manifest copy — nothing is rebuilt. Publishing a release does not
# automatically change floating tags.
# ================
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Custom release tag to promote (e.g. v1.12.0-skn)'
        required: true
permissions:
  contents: read
jobs:
  docker-tags:
    name: Promote Docker tags
    if: github.repository == 'Skaronator/chisel'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Retag version manifests to latest / major / major.minor
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-skn$ ]]; then
            echo "::error::Expected a custom release tag such as v1.12.0-skn"
            exit 1
          fi
          VERSION="${TAG#v}"
          MAJOR="${VERSION%%.*}"
          REST="${VERSION#*.}"
          MINOR="${REST%%.*}"
          echo "promoting ${VERSION} -> latest, ${MAJOR}, ${MAJOR}.${MINOR}"
          for repo in ghcr.io/skaronator/chisel; do
            docker buildx imagetools create \
              --tag "${repo}:latest" \
              --tag "${repo}:${MAJOR}" \
              --tag "${repo}:${MAJOR}.${MINOR}" \
              "${repo}:${VERSION}"
          done
